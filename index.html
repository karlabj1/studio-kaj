    <noscript><link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100;0,200;0,300;0,400;1,100;1,200;1,300;1,400&display=swap" rel="stylesheet"></noscript>

    <script>
        // Fix white screen when navigating back (bfcache restore)
        window.addEventListener('pageshow', function(event) {
            if (event.persisted) {
                window.location.reload();
            }
        });
        
        // Safari mobile viewport fix - run immediately
        (function() {
            function setHeight() {
                var vh = window.innerHeight;
                document.documentElement.style.setProperty('--vh', vh + 'px');
                document.documentElement.style.height = vh + 'px';
                document.body.style.height = vh + 'px';
            }
            
            // Set immediately
            setHeight();
            
            // Update on resize and orientation change
            window.addEventListener('resize', setHeight);
            window.addEventListener('orientationchange', function() {
                setTimeout(setHeight, 100);
            });
            
            // Handle Safari's dynamic address bar - update on scroll
            let ticking = false;
            window.addEventListener('scroll', function() {
                if (!ticking) {
                    window.requestAnimationFrame(function() {
                        setHeight();
                        ticking = false;
                    });
                    ticking = true;
                }
            }, { passive: true });
        })();
    </script>
