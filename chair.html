<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>CHAIR - KAJ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;400&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;400&display=swap" rel="stylesheet"></noscript>
    <link rel="stylesheet" href="page-styles.css?v=4">
</head>
<body>
    <a href="index.html" class="logo">K A J</a>
    <div class="menu-button">
        <span></span>
        <span></span>
    </div>
    <div class="image-gallery">
        <div class="image-item collapsed" data-title="Chair 1">
            <img src="assets/chair1.webp" alt="Chair 1" fetchpriority="high">
            <div class="image-title">Chair 1</div>
        </div>
        <div class="image-item collapsed" data-title="Chair 2">
            <img src="assets/chair2.webp" alt="Chair 2" loading="lazy">
            <div class="image-title">Chair 2</div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const imageItems = document.querySelectorAll('.image-gallery .image-item');
            
            imageItems.forEach(item => {
                item.addEventListener('click', function() {
                    const isExpanded = this.classList.contains('expanded');
                    
                    if (isExpanded) {
                        // Collapse
                        this.classList.remove('expanded');
                        this.classList.add('collapsed');
                    } else {
                        // Expand this item (allow multiple images to be expanded)
                        this.classList.remove('collapsed');
                        this.classList.add('expanded');
                    }
                });
            });
        });
    </script>
</body>
</html>
