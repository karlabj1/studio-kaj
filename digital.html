<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>DIGITAL - KAJ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="page-styles.css?v=4">
</head>
<body>
    <a href="index.html" class="logo">K A J</a>
    <div class="menu-button">
        <span></span>
        <span></span>
    </div>
    <div class="series-container">
        <!-- Regular digital images -->
        <div class="regular-images">
            <div class="image-item collapsed" data-title="Digital 1">
                <img src="assets/digi1.webp" alt="Digital 1" fetchpriority="high">
                <div class="image-title">Digital 1</div>
            </div>
            <div class="image-item collapsed" data-title="Digital 2">
                <img src="assets/digi2.webp" alt="Digital 2" loading="lazy">
                <div class="image-title">Digital 2</div>
            </div>
            <div class="image-item collapsed" data-title="Digital 3">
                <img src="assets/digi3.webp" alt="Digital 3" loading="lazy">
                <div class="image-title">Digital 3</div>
            </div>
            <div class="image-item collapsed" data-title="Digital 4">
                <img src="assets/digi4.webp" alt="Digital 4" loading="lazy">
                <div class="image-title">Digital 4</div>
            </div>
            <div class="image-item collapsed" data-title="Digital 5">
                <img src="assets/digi5.webp" alt="Digital 5" loading="lazy">
                <div class="image-title">Digital 5</div>
            </div>
        </div>
        
        <!-- Chinese Ink Series -->
        <div class="series">
            <div class="series-title">Chinese Ink</div>
            <div class="series-images">
                <div class="image-item collapsed" data-title="Chinese Ink 2">
                    <img src="assets/digi-chineseink2.webp" alt="Chinese Ink 2" loading="lazy">
                    <div class="image-title">Chinese Ink 2</div>
                </div>
                <div class="image-item collapsed" data-title="Chinese Ink 3">
                    <img src="assets/digi-chineseink3.webp" alt="Chinese Ink 3" loading="lazy">
                    <div class="image-title">Chinese Ink 3</div>
                </div>
                <div class="image-item collapsed" data-title="Chinese Ink 4">
                    <img src="assets/digi-chineseink4.webp" alt="Chinese Ink 4" loading="lazy">
                    <div class="image-title">Chinese Ink 4</div>
                </div>
                <div class="image-item collapsed" data-title="Chinese Ink 5">
                    <img src="assets/digi-chineseink5.webp" alt="Chinese Ink 5" loading="lazy">
                    <div class="image-title">Chinese Ink 5</div>
                </div>
            </div>
        </div>
        
        <!-- Free Fighting Series -->
        <div class="series">
            <div class="series-title">Free Fighting</div>
            <div class="series-images">
                <div class="image-item collapsed" data-title="Free Fighting">
                    <img src="assets/digi-freefighting.webp" alt="Free Fighting" loading="lazy">
                    <div class="image-title">Free Fighting</div>
                </div>
            </div>
        </div>
        
        <!-- Mr Shadow Series -->
        <div class="series">
            <div class="series-title">Mr Shadow</div>
            <div class="series-images">
                <div class="image-item collapsed" data-title="Mr Shadow 1">
                    <img src="assets/digi-mrshadow1.webp" alt="Mr Shadow 1" loading="lazy">
                    <div class="image-title">Mr Shadow 1</div>
                </div>
                <div class="image-item collapsed" data-title="Mr Shadow 2">
                    <img src="assets/digi-mrshadow2.webp" alt="Mr Shadow 2" loading="lazy">
                    <div class="image-title">Mr Shadow 2</div>
                </div>
                <div class="image-item collapsed" data-title="Mr Shadow 3">
                    <img src="assets/digi-mrshadow3.webp" alt="Mr Shadow 3" loading="lazy">
                    <div class="image-title">Mr Shadow 3</div>
                </div>
            </div>
        </div>
        
        <!-- Mrs Pliff Series -->
        <div class="series">
            <div class="series-title">Mrs Pliff</div>
            <div class="series-images">
                <div class="image-item collapsed" data-title="Mrs Pliff">
                    <img src="assets/digi-mrspliff.webp" alt="Mrs Pliff" loading="lazy">
                    <div class="image-title">Mrs Pliff</div>
                </div>
            </div>
        </div>
        
        <!-- Untitled Series -->
        <div class="series">
            <div class="series-title">Untitled</div>
            <div class="series-images">
                <div class="image-item collapsed" data-title="Untitled">
                    <img src="assets/digi-untitled.webp" alt="Untitled" loading="lazy">
                    <div class="image-title">Untitled</div>
                </div>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Handle regular images
            const regularImageItems = document.querySelectorAll('.regular-images .image-item');
            
            regularImageItems.forEach(item => {
                item.addEventListener('click', function() {
                    const isExpanded = this.classList.contains('expanded');
                    
                    if (isExpanded) {
                        // Collapse
                        this.classList.remove('expanded');
                        this.classList.add('collapsed');
                    } else {
                        // Collapse all other items first
                        document.querySelectorAll('.image-item').forEach(otherItem => {
                            if (otherItem !== this && otherItem.classList.contains('expanded')) {
                                otherItem.classList.remove('expanded');
                                otherItem.classList.add('collapsed');
                            }
                        });
                        // Expand this item
                        this.classList.remove('collapsed');
                        this.classList.add('expanded');
                    }
                });
            });
            
            // Handle series images
            const seriesImages = document.querySelectorAll('.series-images');
            
            seriesImages.forEach(series => {
                const seriesItems = series.querySelectorAll('.image-item');
                
                seriesItems.forEach(item => {
                    item.addEventListener('click', function() {
                        const isAnyExpanded = Array.from(seriesItems).some(img => img.classList.contains('expanded'));
                        
                        if (isAnyExpanded) {
                            // Collapse all images in this series
                            seriesItems.forEach(img => {
                                img.classList.remove('expanded');
                                img.classList.add('collapsed');
                            });
                        } else {
                            // Collapse all other items first
                            document.querySelectorAll('.image-item').forEach(otherItem => {
                                if (!seriesItems.includes(otherItem) && otherItem.classList.contains('expanded')) {
                                    otherItem.classList.remove('expanded');
                                    otherItem.classList.add('collapsed');
                                }
                            });
                            // Expand all images in this series
                            seriesItems.forEach(img => {
                                img.classList.remove('collapsed');
                                img.classList.add('expanded');
                            });
                        }
                    });
                });
            });
        });
    </script>
</body>
</html>
