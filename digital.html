<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>DIGITAL - KAJ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;400&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;400&display=swap" rel="stylesheet"></noscript>
    <link rel="preload" as="image" href="assets/digi-freefighting.webp" fetchpriority="high">
    <link rel="stylesheet" href="page-styles.css?v=4">
</head>
<body>
    <a href="index.html" class="logo">K A J</a>
    <div class="menu-button">
        <span></span>
        <span></span>
    </div>
    <div class="image-gallery">
        <!-- Free Fighting Series -->
        <div class="series-title">Free Fighting</div>
        <div class="image-item collapsed" data-title="Free Fighting" data-series="free-fighting">
            <img src="assets/digi-freefighting.webp" alt="Free Fighting" fetchpriority="high" decoding="async" width="100" height="80">
            <div class="image-title">Free Fighting</div>
        </div>
        
        <!-- Chinese Ink Series -->
        <div class="series-title">Chinese Ink</div>
        <div class="image-item collapsed" data-title="Chinese Ink 2" data-series="chinese-ink">
            <img src="assets/digi-chineseink2.webp" alt="Chinese Ink 2" loading="lazy" decoding="async" width="100" height="80">
            <div class="image-title">Chinese Ink 2</div>
        </div>
        <div class="image-item collapsed" data-title="Chinese Ink 3" data-series="chinese-ink">
            <img src="assets/digi-chineseink3.webp" alt="Chinese Ink 3" loading="lazy" decoding="async" width="100" height="80">
            <div class="image-title">Chinese Ink 3</div>
        </div>
        <div class="image-item collapsed" data-title="Chinese Ink 4" data-series="chinese-ink">
            <img src="assets/digi-chineseink4.webp" alt="Chinese Ink 4" loading="lazy" decoding="async" width="100" height="80">
            <div class="image-title">Chinese Ink 4</div>
        </div>
        <div class="image-item collapsed" data-title="Chinese Ink 5" data-series="chinese-ink">
            <img src="assets/digi-chineseink5.webp" alt="Chinese Ink 5" loading="lazy" decoding="async" width="100" height="80">
            <div class="image-title">Chinese Ink 5</div>
        </div>
        
        <!-- Regular digital images -->
        <div class="image-item collapsed" data-title="Digital 1" data-regular="true">
            <img src="assets/digi1.webp" alt="Digital 1" loading="lazy" decoding="async" width="100" height="80">
            <div class="image-title">Digital 1</div>
        </div>
        <div class="image-item collapsed" data-title="Digital 2" data-regular="true">
            <img src="assets/digi2.webp" alt="Digital 2" loading="lazy" decoding="async" width="100" height="80">
            <div class="image-title">Digital 2</div>
        </div>
        <div class="image-item collapsed" data-title="Digital 3" data-regular="true">
            <img src="assets/digi3.webp" alt="Digital 3" loading="lazy" decoding="async" width="100" height="80">
            <div class="image-title">Digital 3</div>
        </div>
        <div class="image-item collapsed" data-title="Digital 4" data-regular="true">
            <img src="assets/digi4.webp" alt="Digital 4" loading="lazy" decoding="async" width="100" height="80">
            <div class="image-title">Digital 4</div>
        </div>
        <div class="image-item collapsed" data-title="Digital 5" data-regular="true">
            <img src="assets/digi5.webp" alt="Digital 5" loading="lazy" decoding="async" width="100" height="80">
            <div class="image-title">Digital 5</div>
        </div>
        
        <!-- Mrs Pliff Series -->
        <div class="series-title">Mrs Pliff</div>
        <div class="image-item collapsed" data-title="Mrs Pliff" data-series="mrs-pliff">
            <img src="assets/digi-mrspliff.webp" alt="Mrs Pliff" loading="lazy" decoding="async" width="100" height="80">
            <div class="image-title">Mrs Pliff</div>
        </div>
        
        <!-- Untitled Series -->
        <div class="series-title">Untitled</div>
        <div class="image-item collapsed" data-title="Untitled" data-series="untitled">
            <img src="assets/digi-untitled.webp" alt="Untitled" loading="lazy" decoding="async" width="100" height="80">
            <div class="image-title">Untitled</div>
        </div>
        
        <!-- Mr Shadow Series -->
        <div class="series-title">Mr Shadow</div>
        <div class="image-item collapsed" data-title="Mr Shadow 1" data-series="mr-shadow">
            <img src="assets/digi-mrshadow1.webp" alt="Mr Shadow 1" loading="lazy" decoding="async" width="100" height="80">
            <div class="image-title">Mr Shadow 1</div>
        </div>
        <div class="image-item collapsed" data-title="Mr Shadow 2" data-series="mr-shadow">
            <img src="assets/digi-mrshadow2.webp" alt="Mr Shadow 2" loading="lazy" decoding="async" width="100" height="80">
            <div class="image-title">Mr Shadow 2</div>
        </div>
        <div class="image-item collapsed" data-title="Mr Shadow 3" data-series="mr-shadow">
            <img src="assets/digi-mrshadow3.webp" alt="Mr Shadow 3" loading="lazy" decoding="async" width="100" height="80">
            <div class="image-title">Mr Shadow 3</div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const imageItems = document.querySelectorAll('.image-gallery .image-item');
            
            // Ensure all images start collapsed
            imageItems.forEach(item => {
                if (!item.classList.contains('expanded')) {
                    item.classList.add('collapsed');
                }
            });
            
            imageItems.forEach(item => {
                // Handle both click and touch for mobile
                const handleInteraction = function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    
                    const isRegular = this.getAttribute('data-regular') === 'true';
                    const seriesName = this.getAttribute('data-series');
                    
                    if (isRegular) {
                        // Regular image - toggle individually, allow multiple
                        const isExpanded = this.classList.contains('expanded');
                        if (isExpanded) {
                            this.classList.remove('expanded');
                            this.classList.add('collapsed');
                        } else {
                            this.classList.remove('collapsed');
                            this.classList.add('expanded');
                        }
                    } else if (seriesName) {
                        // Series image - expand/collapse entire series
                        const seriesItems = Array.from(document.querySelectorAll(`[data-series="${seriesName}"]`));
                        const isAnyExpanded = seriesItems.some(img => img.classList.contains('expanded'));
                        
                        if (isAnyExpanded) {
                            // Collapse this series
                            seriesItems.forEach(img => {
                                img.classList.remove('expanded');
                                img.classList.add('collapsed');
                            });
                        } else {
                            // Collapse all other series first (by checking their data-series attribute)
                            const allSeriesItems = Array.from(document.querySelectorAll('[data-series]'));
                            allSeriesItems.forEach(img => {
                                const imgSeries = img.getAttribute('data-series');
                                if (imgSeries !== seriesName && img.classList.contains('expanded')) {
                                    img.classList.remove('expanded');
                                    img.classList.add('collapsed');
                                }
                            });
                            
                            // Expand this series
                            seriesItems.forEach(img => {
                                img.classList.remove('collapsed');
                                img.classList.add('expanded');
                            });
                        }
                    }
                };
                
                // Use click for desktop, touchend for mobile (more reliable than touchstart)
                item.addEventListener('click', handleInteraction);
                item.addEventListener('touchend', function(e) {
                    handleInteraction.call(this, e);
                }, { passive: false });
            });
        });
    </script>
</body>
</html>
