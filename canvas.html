<head>
    <meta charset="UTF-8">

    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <meta name="version" content="v5">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;400&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;400&display=swap" rel="stylesheet"></noscript>
    <link rel="preload" as="image" href="assets/canvas-freefight3.webp" fetchpriority="high">
    <link rel="stylesheet" href="page-styles.css?v=7&t=1767148903">
</head>
<body>
    <a href="index.html" class="logo">K A J</a>
    <div class="menu-button">
        <span></span>
        <span></span>
    </div>
    <div class="version-badge">v7 - NEW VERSION</div>
    <div class="image-gallery">
        <div class="image-item collapsed" data-title="Free Fight">
            <img src="assets/canvas-freefight3.webp" alt="Free Fight" fetchpriority="high" decoding="async" width="100" height="80">
            <div class="image-title">Free Fight</div>
        </div>
        <div class="image-item collapsed" data-title="Palm3">
            <img src="assets/canvas-palm1.webp" alt="Palm3" loading="lazy" decoding="async" width="100" height="80">
            <div class="image-title">Palm3</div>
        </div>
        <div class="image-item collapsed" data-title="Smirk">
            <img src="assets/canvas-smirk2.webp" alt="Smirk" loading="lazy" decoding="async" width="100" height="80">
            <div class="image-title">Smirk</div>
        </div>
    </div>
    <script>
        // Version: v6 - Mobile touch fix
        console.log('Canvas gallery v6 loaded');
        (function() {
            function initGallery() {
                const imageItems = document.querySelectorAll('.image-gallery .image-item');
                
                // Ensure all images start collapsed
                imageItems.forEach(item => {
                    if (!item.classList.contains('expanded')) {
                        item.classList.add('collapsed');
                    }
                });
                
                imageItems.forEach(item => {
                    let touchStartY = 0;
                    let touchMoved = false;
                    
                    const handleInteraction = function(e) {
                        // For touch events, only prevent if it wasn't a scroll
                        if (e.type === 'touchend' && touchMoved) {
                            touchMoved = false;
                            return;
                        }
                        
                        if (e.type === 'touchend') {
                            e.preventDefault();
                        }
                        
                        const isExpanded = this.classList.contains('expanded');
                        
                        if (isExpanded) {
                            this.classList.remove('expanded');
                            this.classList.add('collapsed');
                        } else {
                            this.classList.remove('collapsed');
                            this.classList.add('expanded');
                        }
                    };
                    
                    // Track touch start
                    item.addEventListener('touchstart', function(e) {
                        touchStartY = e.touches[0].clientY;
                        touchMoved = false;
                    }, { passive: true });
                    
                    // Track if user is scrolling
                    item.addEventListener('touchmove', function(e) {
                        const touchY = e.touches[0].clientY;
                        if (Math.abs(touchY - touchStartY) > 5) {
                            touchMoved = true;
                        }
                    }, { passive: true });
                    
                    // Handle click (works on both desktop and mobile)
                    item.addEventListener('click', handleInteraction);
                    
                    // Handle touch end
                    item.addEventListener('touchend', handleInteraction, { passive: false });
                });
            }
            
            // Initialize
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initGallery);
            } else {
                initGallery();
            }
        })();
    </script>
</body>
</html>
