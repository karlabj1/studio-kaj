<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>CANVAS - KAJ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="page-styles.css?v=4">
</head>
<body>
    <a href="index.html" class="logo">K A J</a>
    <div class="menu-button">
        <span></span>
        <span></span>
    </div>
    <div class="image-gallery">
        <div class="image-item collapsed" data-title="Free Fight">
            <img src="assets/canvas-freefight3.webp" alt="Free Fight" fetchpriority="high">
            <div class="image-title">Free Fight</div>
        </div>
        <div class="image-item collapsed" data-title="Palm">
            <img src="assets/canvas-palm1.webp" alt="Palm" loading="lazy">
            <div class="image-title">Palm</div>
        </div>
        <div class="image-item collapsed" data-title="Smirk">
            <img src="assets/canvas-smirk2.webp" alt="Smirk" loading="lazy">
            <div class="image-title">Smirk</div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const imageItems = document.querySelectorAll('.image-gallery .image-item');
            
            imageItems.forEach(item => {
                item.addEventListener('click', function() {
                    const isExpanded = this.classList.contains('expanded');
                    
                    if (isExpanded) {
                        // Collapse
                        this.classList.remove('expanded');
                        this.classList.add('collapsed');
                    } else {
                        // Collapse any other expanded items first
                        imageItems.forEach(otherItem => {
                            if (otherItem !== this && otherItem.classList.contains('expanded')) {
                                otherItem.classList.remove('expanded');
                                otherItem.classList.add('collapsed');
                            }
                        });
                        // Expand this item
                        this.classList.remove('collapsed');
                        this.classList.add('expanded');
                    }
                });
            });
        });
    </script>
</body>
</html>
